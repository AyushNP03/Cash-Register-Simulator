<!DOCTYPE HTML>
<html >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Register System</title>
    <link rel="stylesheet" href="cash.css">
</head>
<body>

<div class="container">
    <h1>Cash Register System</h1>

    <div class="input_section">
        <label for="itemCount">Enter number of items:</label>
        <input type="number" id="itemCount" placeholder="Enter Number of Items" min="1">
    </div>

    <div class="button-section">
        <button id="scan">Scan Items</button>
        <button id="printTotal">Show Total</button>
        <button id="resetAll">Reset</button>
    </div>

    <div class="items-section">
        <h2>Scanned Items</h2>
        <ul id="scannedItems"></ul>
    </div>

    <div class="total-section">
        <h3>Total Cost:</h3> 
        <span id="totalDisplay">$0</span>
    </div>
</div>
    <script src="cash.js"></script>
</body>
</html>
